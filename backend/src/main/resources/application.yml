server:
  port: 8080

spring:
  application:
    name: futuretech-backend

  datasource:
    url: jdbc:mysql://localhost:3306/future_tech?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # Ensure 256-bit+ secure key in production
    expiration-ms: 86400000 # 1 Day

resend:
  api:
    key: re_placeholder_key # Replace with valid Resend API key
